<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<meta name="darkreader-lock">
<title>KhangFlash · Cây kiến thức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: only light !important;
    forced-color-adjust: none !important;
    --bg: #F5F5F0;
    --surface: #FAFBF7;
    --ink: #263B34;
    --muted: #5C6E66;
    --border: #DCE2D6;
    --sage: #E8EEDF;
    --sage-border: #BAC8AE;
    --line: #C7D1BE;
  }
  * { box-sizing: border-box; forced-color-adjust: none; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #F5F5F0 !important;
    color: #263B34 !important;
    font: 14px/1.5 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    color-scheme: only light !important;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: #263B34; }
  button { border: 0; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid #7D9574;
    outline-offset: 2px;
  }

  /* Compact Full-Screen Header (gives 90%+ height to the tree workspace!) */
  header {
    height: 54px;
    flex-shrink: 0;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border-bottom: 1px solid #DCE2D6;
    background: #FAFBF7 !important;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: #263B34; white-space: nowrap; }
  .logo {
    width: 30px; height: 32px; display: grid; place-items: center;
    background: #4F684A; color: #FAFBF7; border-radius: 9px 9px 14px 4px;
    font-weight: 700; font-size: 15px;
  }
  .brand-sub { font-size: 12px; font-weight: 500; color: #5C6E66; border-left: 1px solid #DCE2D6; padding-left: 10px; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .search {
    width: 270px; max-width: 42vw;
    display: flex; align-items: center; gap: 7px;
    border: 1px solid #DCE2D6;
    background: #F5F5F0 !important;
    border-radius: 8px;
    padding: 6px 10px;
  }
  .search span { color: #5C6E66; font-size: 13px; }
  .search input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 12px; color: #263B34; }
  .search input::placeholder { color: #7C8B83; }
  #closeTree {
    width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
    font-size: 22px; line-height: 1; color: #263B34; border: 1px solid #DCE2D6; background: #FAFBF7;
  }
  #closeTree:hover { background: #E8EEDF; }

  /* Full-Bleed Workspace (fills 100% remaining screen!) */
  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 220px minmax(420px, 1fr) 320px;
    background: #FAFBF7 !important;
  }

  aside {
    padding: 16px 13px;
    border-right: 1px solid #DCE2D6;
    overflow-y: auto;
    background: #FAFBF7 !important;
  }
  .eyebrow { font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; color: #5C6E66; font-weight: 600; }
  .deckTitle { font-size: 14.5px; font-weight: 700; line-height: 1.4; margin: 7px 0 3px; color: #263B34; }
  .subtle { font-size: 11px; color: #5C6E66; margin: 0; }
  .branches { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
  .branch {
    display: flex; gap: 8px; text-align: left; align-items: center;
    padding: 9px 9px; border-radius: 8px; font-size: 12px; line-height: 1.4;
    color: #263B34; border: 1px solid transparent;
  }
  .branch:hover { background: #F1F4EA; }
  .branch.active { background: #E8EEDF !important; border-color: #BAC8AE; font-weight: 600; }
  .dot { width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; background: var(--tone); }
  .num { margin-left: auto; font-size: 11px; color: #5C6E66; padding-left: 6px; }
  .asideFoot {
    margin-top: 18px; padding-top: 12px; border-top: 1px solid #DCE2D6;
    line-height: 1.6; font-size: 11px; color: #5C6E66;
  }

  /* Center Map Panel */
  .mapPanel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #F5F5F0 !important;
  }
  .mapBar {
    min-height: 46px;
    padding: 6px 14px;
    border-bottom: 1px solid #DCE2D6;
    background: #FAFBF7 !important;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11.5px;
  }
  .crumb { color: #5C6E66; }
  .crumb b { color: #263B34; font-weight: 600; }
  .mapControls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #groups {
    max-width: 215px;
    border: 1px solid #DCE2D6;
    border-radius: 7px;
    background: #FAFBF7 !important;
    color: #263B34;
    padding: 5px 7px;
    font-size: 11.5px;
  }
  .canvas.is-map { cursor: grab; }
  .canvas.is-map.is-dragging { cursor: grabbing; user-select: none; }
  .switch { display: flex; background: #F5F5F0; border: 1px solid #DCE2D6; border-radius: 7px; padding: 2px; }
  .switch button { font-size: 11px; padding: 4px 9px; border-radius: 5px; color: #5C6E66; font-weight: 500; }
  .switch .active { background: #FAFBF7 !important; color: #263B34; font-weight: 600; border: 1px solid #DCE2D6; }

  .canvas {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: auto;
    background-color: #F5F5F0 !important;
    background-image: radial-gradient(#D5DDD0 0.75px, transparent 0.75px);
    background-size: 20px 20px;
  }
  .zoom-stage { position: relative; margin: 0 auto; }
  .diagram { position: relative; transform-origin: top left; }
  .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lines path { fill: none; stroke: #C7D1BE; stroke-width: 1.3; }
  .lines path.active-path { stroke: #8FA383; stroke-width: 1.65; }

  .node {
    position: absolute;
    border: 1px solid #DCE2D6;
    border-radius: 9px;
    background: #FAFBF7 !important;
    color: #263B34 !important;
    padding: 9px 12px;
    text-align: left;
    font-size: 12px;
    line-height: 1.45;
    overflow-wrap: break-word;
    word-break: normal;
  }
  button.node:hover { border-color: #BAC8AE; background: #F1F4EA !important; }
  .node.selected { border-color: #93A787; background: #E8EEDF !important; }
  .root {
    left: 16px;
    width: 150px;
    padding: 13px 13px;
    background: #E8EEDF !important;
    border-color: #BAC8AE;
  }
  .root strong { display: block; font-size: 13px; line-height: 1.4; margin-top: 3px; }
  .root small { display: block; margin-top: 5px; color: #5C6E66; font-size: 11px; }
  .node small { display: block; color: #5C6E66; font-size: 10.5px; margin-top: 3px; }
  .hub { left: 202px; width: 184px; }
  .leaf { width: 196px; display: flex; align-items: flex-start; gap: 7px; }
  .leaf-dot { width: 5px; height: 5px; border-radius: 50%; background: #8DA280; flex-shrink: 0; margin-top: 7px; }

  .mapFooter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    border-top: 1px solid #DCE2D6;
    background: #FAFBF7 !important;
    font-size: 11px;
    color: #5C6E66;
  }

  .list { padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .list button {
    text-align: left;
    border: 1px solid #DCE2D6;
    padding: 11px 13px;
    background: #FAFBF7 !important;
    color: #263B34 !important;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.45;
    content-visibility: auto;
    contain-intrinsic-size: 62px;
  }
  .list button:hover { background: #F1F4EA !important; border-color: #BAC8AE; }
  .list button.selected { background: #E8EEDF !important; border-color: #93A787; }
  .list small { display: block; color: #5C6E66; margin-top: 4px; font-size: 11.5px; font-weight: 400; }
  .empty { padding: 28px; color: #5C6E66; font-size: 13px; }

  /* Right Panel: Stable Details */
  .details {
    border-left: 1px solid #DCE2D6;
    padding: 18px 20px;
    overflow-y: auto;
    background: #FAFBF7 !important;
  }
  .detailTag { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #5C6E66; margin-top: 14px; font-weight: 600; }
  .details h2 { font-size: 21px; line-height: 1.36; letter-spacing: -0.4px; font-weight: 700; margin: 7px 0; color: #263B34; }
  .meaning { font-size: 13.5px; color: #3D524A; line-height: 1.62; margin-bottom: 6px; }
  .rule { height: 1px; background: #DCE2D6; margin: 16px 0; }
  .example {
    font-size: 13px;
    line-height: 1.7;
    margin: 9px 0 12px;
    padding: 13px 15px;
    background: #F5F5F0 !important;
    border: 1px solid #DCE2D6;
    border-radius: 8px;
    color: #263B34 !important;
    text-align: left !important;
    letter-spacing: 0;
    word-spacing: 0;
    overflow-wrap: break-word;
  }
  .audio {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 13px; border: 1px solid #DCE2D6; border-radius: 7px;
    font-size: 12px; font-weight: 500; background: #F5F5F0 !important; color: #263B34;
  }
  .audio:hover { background: #E8EEDF !important; border-color: #BAC8AE; }
  #audioStatus { display: block; margin-top: 6px; font-size: 11px; color: #5C6E66; min-height: 15px; }
  .bookmark {
    width: 100%; padding: 10px 14px;
    background: #E8EEDF !important; border: 1px solid #BAC8AE; border-radius: 8px;
    font-size: 12.5px; font-weight: 600; color: #263B34; margin-top: 10px;
  }
  .bookmark:hover { background: #DFE8D4 !important; }
  .note { font-size: 11px; color: #5C6E66; line-height: 1.6; margin-top: 14px; }
  [hidden] { display: none !important; }

  @media (max-width: 1120px) {
    .workspace { grid-template-columns: 190px minmax(340px, 1fr); overflow-y: auto; }
    .details { grid-column: 1 / -1; border-left: 0; border-top: 1px solid #DCE2D6; }
    .mapPanel { min-height: 480px; }
    .brand-sub { display: none; }
  }
  @media (max-width: 680px) {
    header { padding: 0 12px; }
    .search { width: 160px; }
    .workspace { display: flex; flex-direction: column; overflow-y: auto; }
    aside { border-right: 0; border-bottom: 1px solid #DCE2D6; padding: 12px; }
    .branches { flex-direction: row; overflow-x: auto; margin-top: 10px; }
    .branch { min-width: 145px; flex-shrink: 0; }
    .asideFoot { display: none; }
    .mapPanel { min-height: 460px; flex-shrink: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">K</span>
    <span>KhangFlash</span>
    <span class="brand-sub">Mỗi từ, một nhánh hiểu biết.</span>
  </div>
  <div class="head-right">
    <label class="search">
      <span>⌕</span>
      <input id="search" type="search" aria-label="Tìm từ hoặc nghĩa" placeholder="Tìm từ hoặc nghĩa tiếng Việt…">
    </label>
    <button type="button" id="closeTree" aria-label="Đóng cây kiến thức">×</button>
  </div>
</header>

<main class="workspace">
  <aside>
    <div class="eyebrow">BỘ TỪ ĐANG KHÁM PHÁ</div>
    <div class="deckTitle" id="deckTitle">Đang tải bộ từ…</div>
    <p class="subtle" id="deckStats"></p>
    <div class="branches" id="branches"></div>
    <div class="asideFoot">
      Chọn nhánh · Bấm từ xem nghĩa.<br><br>
      <span id="savedCount"></span>
    </div>
  </aside>

  <section class="mapPanel">
    <div class="mapBar">
      <span class="crumb"><span id="crumbDeck">Bộ từ</span> <span style="margin:0 5px">/</span> <b id="branchLabel"></b></span>
      <div class="mapControls">
        <select id="groups" aria-label="Chọn nhóm từ"></select>
        <div class="switch">
          <button type="button" id="mapBtn" class="active">Sơ đồ</button>
          <button type="button" id="listBtn">Danh sách</button>
        </div>
      </div>
    </div>
    <div class="canvas" id="canvas"></div>
    <div class="mapFooter">
      <span id="mapInfo"></span>
      <span id="scrollHint">Cuộn chuột để zoom · Kéo chuột để di chuyển · Nhấp đúp nền để vừa khung</span>
    </div>
  </section>

  <section class="details" aria-label="Chi tiết từ vựng">
    <div class="eyebrow">MỘT TỪ, TRONG NGỮ CẢNH</div>
    <div id="detail"></div>
  </section>
</main>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  let DATA = { nodes: [], cards: [] };
  let branches = [];
  let branchCardCounts = new Map();
  let allCardNodes = [];
  let deckTitleText = 'Bộ từ';
  const tones = ['#8FA680', '#8AA9AB', '#B8938F', '#8BA898', '#B8A07E', '#B3AA70', '#8DA0B5', '#A396B2'];

  let branch = null, hub = null, selected = null, view = 'map', query = '';
  let zoom = 1;
  let naturalW = 860, naturalH = 500;
  let listRenderJob = 0;
  let saved = new Set();
  try { saved = new Set(JSON.parse(localStorage.getItem('kf-tree-design-saved-v1') || '[]')); } catch {}

  $('closeTree').onclick = () => parent.postMessage({ type: 'kf-tree-close' }, location.origin);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('closeTree').click(); });

  function getBranchNodes(b) {
    const out = [];
    const seen = new Set();
    for (let i = 0; i < b.ch.length; i++) {
      const h = DATA.nodes[b.ch[i]];
      if (h && h.ci >= 0 && !seen.has(DATA.cards[h.ci].id)) {
        seen.add(DATA.cards[h.ci].id);
        out.push(h);
      }
      if (h && h.ch) {
        for (let j = 0; j < h.ch.length; j++) {
          const lf = DATA.nodes[h.ch[j]];
          if (lf && lf.ci >= 0 && !seen.has(DATA.cards[lf.ci].id)) {
            seen.add(DATA.cards[lf.ci].id);
            out.push(lf);
          }
        }
      }
    }
    return out;
  }

  function renderBranches() {
    $('branches').innerHTML = branches.map((n, i) =>
      `<button type="button" class="branch ${n.id === branch.id ? 'active' : ''}" data-branch="${n.id}" aria-pressed="${n.id === branch.id}"><span class="dot" style="--tone:${tones[i % tones.length]}"></span><span>${esc(n.l)}</span><span class="num">${branchCardCounts.get(n.id) || 0}</span></button>`
    ).join('');
    $('branchLabel').textContent = branch.l;
    $('savedCount').textContent = saved.size + ' từ đã đánh dấu trên thiết bị này';
  }

  function showDetail(n) {
    if (!n || n.ci < 0) return;
    selected = n;
    const c = DATA.cards[n.ci];
    const bName = branches.find(b => b.lm === n.lm)?.l || 'Từ vựng';
    $('detail').innerHTML = `
      <div class="detailTag">${esc(bName)}</div>
      <h2>${esc(c.t)}</h2>
      <div class="meaning">${esc(c.d)}</div>
      ${c.p || c.ipa ? `<p class="subtle">${esc(c.p)} ${esc(c.ipa)}</p>` : ''}
      <div class="rule"></div>
      <div class="eyebrow">VÍ DỤ SỬ DỤNG</div>
      <p class="example">${esc(c.e || 'Thẻ này chưa có câu ví dụ.')}</p>
      <button type="button" class="audio" id="listen">◖)) &nbsp; Nghe câu ví dụ</button>
      <span id="audioStatus" role="status"></span>
      <button type="button" class="bookmark" id="save">${saved.has(c.id) ? '✓ Đã đánh dấu' : '＋ Đánh dấu để xem lại'}</button>
      <p class="note">Đánh dấu riêng trên thiết bị này.<br>Không thay đổi tiến độ hay lịch ôn của bạn.</p>
    `;
    $('listen').onclick = () => {
      if (parent !== window) {
        parent.postMessage({ type: 'kf-tree-speak', text: c.e || c.t }, location.origin);
        $('audioStatus').textContent = 'Đang phát giọng đọc…';
        return;
      }
      if (!window.speechSynthesis) { $('audioStatus').textContent = 'Trình duyệt chưa hỗ trợ giọng đọc.'; return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(c.e || c.t);
      u.lang = 'en-GB';
      u.onstart = () => ($('audioStatus').textContent = 'Đang đọc…');
      u.onend = () => ($('audioStatus').textContent = 'Đã đọc xong');
      u.onerror = () => ($('audioStatus').textContent = 'Chưa phát được. Thử lại sau.');
      speechSynthesis.speak(u);
    };
    $('save').onclick = () => {
      if (saved.has(c.id)) saved.delete(c.id);
      else saved.add(c.id);
      try { localStorage.setItem('kf-tree-design-saved-v1', JSON.stringify([...saved])); } catch {}
      showDetail(n);
      $('savedCount').textContent = saved.size + ' từ đã đánh dấu trên thiết bị này';
    };
  }

  function applyZoom(nextZoom, clientX, clientY) {
    const canvas = $('canvas');
    const stage = canvas.querySelector('.zoom-stage');
    const diag = canvas.querySelector('.diagram');
    const prevZoom = zoom;
    zoom = Math.max(0.45, Math.min(2.0, Number(nextZoom.toFixed(3))));
    if (stage && diag) {
      const useAnchor = typeof clientX === 'number' && typeof clientY === 'number';
      let anchorX = 0, anchorY = 0, offsetX = 0, offsetY = 0;
      if (useAnchor) {
        const rect = canvas.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        anchorX = (clientX - stageRect.left) / prevZoom;
        anchorY = (clientY - stageRect.top) / prevZoom;
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
      }
      diag.style.transform = `scale(${zoom})`;
      stage.style.width = Math.round(naturalW * zoom) + 'px';
      stage.style.height = Math.round(naturalH * zoom) + 'px';
      if (useAnchor) {
        canvas.scrollLeft = Math.max(0, stage.offsetLeft + anchorX * zoom - offsetX);
        canvas.scrollTop = Math.max(0, stage.offsetTop + anchorY * zoom - offsetY);
      }
    }
    const hint = $('scrollHint');
    if (hint && view === 'map' && !query) {
      hint.textContent = `${Math.round(zoom * 100)}% · Cuộn chuột để zoom · Kéo chuột để di chuyển · Nhấp đúp nền để vừa khung`;
    }
  }

  function fitZoom() {
    const cw = Math.max(320, $('canvas').clientWidth - 20);
    const ch = Math.max(260, $('canvas').clientHeight - 20);
    const fit = Math.min(1.0, cw / naturalW, ch / naturalH);
    applyZoom(Math.max(0.55, fit));
  }

  function highlightSelectedNode(nid) {
    const prev = $('canvas').querySelectorAll('.selected[data-node]');
    for (let i = 0; i < prev.length; i++) prev[i].classList.remove('selected');
    const next = $('canvas').querySelector(`[data-node="${nid}"]`);
    if (next) next.classList.add('selected');
  }

  function renderFullList(nodes, labelText) {
    const job = ++listRenderJob;
    const canvas = $('canvas');
    $('mapInfo').textContent = labelText;
    $('scrollHint').textContent = nodes.length ? 'Hiển thị toàn bộ ' + nodes.length.toLocaleString('vi-VN') + ' từ (lưới ngang)' : '';
    if (!nodes.length) {
      canvas.innerHTML = '<div class="empty">Không tìm thấy từ phù hợp.</div>';
      return;
    }
    const listEl = document.createElement('div');
    listEl.className = 'list';
    canvas.classList.remove('is-map', 'is-dragging');
    canvas.replaceChildren(listEl);

    let idx = 0;
    const CHUNK = 120;
    function appendChunk() {
      if (job !== listRenderJob) return;
      const frag = document.createDocumentFragment();
      const end = Math.min(nodes.length, idx + CHUNK);
      for (; idx < end; idx++) {
        const n = nodes[idx];
        const c = DATA.cards[n.ci];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.node = String(n.id);
        if (selected && selected.id === n.id) btn.className = 'selected';
        btn.append(document.createTextNode(c.t));
        const sm = document.createElement('small');
        sm.textContent = c.d;
        btn.append(sm);
        frag.append(btn);
      }
      listEl.append(frag);
      if (idx < nodes.length) requestAnimationFrame(appendChunk);
    }
    appendChunk();
  }

  // Horizontal Multi-Column Diagram: spreads leaves into 2-3 columns horizontally so it NEVER stretches vertically into a giant skinny tower!
  function renderDiagram(autoFit) {
    listRenderJob++;
    const hubs = branch.ch.map(i => DATA.nodes[i]);
    if (!hub || hub.p !== branch.id) hub = hubs[0];
    const leaves = hub ? hub.ch.map(i => DATA.nodes[i]) : [];
    const hi = hubs.indexOf(hub);

    // Choose 1, 2, or 3 horizontal leaf columns based on leaf count (keeps height compact!)
    const leafCols = leaves.length > 16 ? 3 : (leaves.length > 7 ? 2 : 1);
    const LEAF_W = 196;
    const LEAF_COL_GAP = 16;
    const LEAF_START_X = 422;
    const diagW = LEAF_START_X + leafCols * LEAF_W + (leafCols - 1) * LEAF_COL_GAP + 20;

    const canvas = $('canvas');
    const stage = document.createElement('div');
    stage.className = 'zoom-stage';
    const diagram = document.createElement('div');
    diagram.className = 'diagram';
    diagram.style.width = diagW + 'px';
    stage.append(diagram);

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'lines');
    diagram.append(svg);

    const rootEl = document.createElement('div');
    rootEl.className = 'node root';
    rootEl.innerHTML = `<div class="eyebrow" style="font-size:9px">CHỦ ĐỀ</div><strong>${esc(branch.l)}</strong><small>${branchCardCounts.get(branch.id) || 0} từ liên kết</small>`;
    diagram.append(rootEl);

    const hubEls = hubs.map(h => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'node hub' + (h.id === hub.id ? ' selected' : '');
      btn.dataset.hub = String(h.id);
      btn.innerHTML = `${esc(h.l)}<small>${h.ch.length} từ liên quan</small>`;
      diagram.append(btn);
      return { n: h, el: btn };
    });

    const leafEls = leaves.map(lf => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'node leaf' + (selected && selected.id === lf.id ? ' selected' : '');
      btn.dataset.node = String(lf.id);
      btn.innerHTML = `<span class="leaf-dot"></span><span>${esc(lf.l)}</span>`;
      diagram.append(btn);
      return { n: lf, el: btn };
    });

    canvas.classList.add('is-map');
    canvas.replaceChildren(stage);

    // Pass 2: measure real DOM heights and arrange leaves horizontally across 1-3 columns!
    const PAD_TOP = 20;
    const PAD_BOT = 24;
    const HUB_GAP = 10;
    const LEAF_GAP = 10;

    let hubTotalH = 0;
    const hubHeights = hubEls.map(x => { const h = x.el.offsetHeight || 58; hubTotalH += h; return h; });
    if (hubHeights.length > 1) hubTotalH += (hubHeights.length - 1) * HUB_GAP;

    // Distribute leaves evenly across `leafCols` columns
    const perCol = Math.ceil(leafEls.length / leafCols) || 1;
    const colHeights = new Array(leafCols).fill(0);
    const colStartY = new Array(leafCols).fill(PAD_TOP);
    const leafCoords = [];

    for (let i = 0; i < leafEls.length; i++) {
      const col = Math.floor(i / perCol);
      const h = leafEls[i].el.offsetHeight || 44;
      const x = LEAF_START_X + col * (LEAF_W + LEAF_COL_GAP);
      const y = colStartY[col];
      leafEls[i].el.style.left = x + 'px';
      leafEls[i].el.style.top = Math.round(y) + 'px';
      leafCoords.push({ col, x, cy: y + h / 2 });
      colStartY[col] += h + LEAF_GAP;
      colHeights[col] = colStartY[col] - PAD_TOP - LEAF_GAP;
    }

    const maxLeafH = Math.max(0, ...colHeights);
    const rootH = rootEl.offsetHeight || 88;
    const contentH = Math.max(hubTotalH, maxLeafH, rootH, 320);
    const totalH = Math.round(contentH + PAD_TOP + PAD_BOT);

    // Position hubs starting near top
    let hy = PAD_TOP;
    const hubCenters = [];
    let activeHubCenterY = PAD_TOP + 34;
    for (let i = 0; i < hubEls.length; i++) {
      hubEls[i].el.style.top = Math.round(hy) + 'px';
      const cy = hy + hubHeights[i] / 2;
      hubCenters.push({ id: hubEls[i].n.id, cy });
      if (hubEls[i].n.id === hub.id) activeHubCenterY = cy;
      hy += hubHeights[i] + HUB_GAP;
    }

    const rootTop = Math.round(PAD_TOP + Math.min(120, Math.max(0, (Math.min(hubTotalH, 360) - rootH) / 2)));
    rootEl.style.top = rootTop + 'px';
    const rootCy = rootTop + rootH / 2;

    naturalW = diagW;
    naturalH = totalH;
    diagram.style.height = totalH + 'px';
    svg.setAttribute('viewBox', `0 0 ${diagW} ${totalH}`);

    // Clean SVG Bezier paths: Root(166) -> Hubs(202), Active Hub(386) -> First Column Leaves(422) + subtle rail for col 2/3
    let pathsHtml = '';
    for (let i = 0; i < hubCenters.length; i++) {
      const hc = hubCenters[i];
      const cls = hc.id === hub.id ? ' class="active-path"' : '';
      pathsHtml += `<path${cls} d="M166 ${rootCy.toFixed(1)} C185 ${rootCy.toFixed(1)} 183 ${hc.cy.toFixed(1)} 202 ${hc.cy.toFixed(1)}"/>`;
    }
    for (let i = 0; i < leafCoords.length; i++) {
      const lc = leafCoords[i];
      if (lc.col === 0) {
        pathsHtml += `<path class="active-path" d="M386 ${activeHubCenterY.toFixed(1)} C405 ${activeHubCenterY.toFixed(1)} 403 ${lc.cy.toFixed(1)} ${lc.x} ${lc.cy.toFixed(1)}"/>`;
      }
    }
    svg.innerHTML = pathsHtml;

    $('mapInfo').textContent = `Nhóm ${hi + 1}/${hubs.length} · ${leaves.length} từ (${leafCols} cột ngang)`;
    $('scrollHint').textContent = 'Ctrl + cuộn chuột hoặc bấm − / + để thu phóng';

    if (autoFit) fitZoom();
    else applyZoom(zoom);
  }

  function render(autoFit = false) {
    if (!branch) return;
    renderBranches();
    $('groups').innerHTML = branch.ch.map(id =>
      `<option value="${id}" ${hub && hub.id === id ? 'selected' : ''}>${esc(DATA.nodes[id].l)}</option>`
    ).join('');
    $('mapBtn').classList.toggle('active', view === 'map' && !query);
    $('listBtn').classList.toggle('active', view === 'list' || !!query);

    if (query) {
      const q = norm(query);
      const matches = allCardNodes.filter(n => DATA.cards[n.ci]._norm.includes(q));
      renderFullList(matches, matches.length.toLocaleString('vi-VN') + ' từ phù hợp');
      return;
    }
    if (view === 'list') {
      const nodes = getBranchNodes(branch);
      renderFullList(nodes, nodes.length.toLocaleString('vi-VN') + ' từ trong nhánh ' + branch.l);
      return;
    }
    renderDiagram(autoFit);
  }

  let panActive = false, panMoved = false, panStartX = 0, panStartY = 0, panScrollL = 0, panScrollT = 0;

  $('canvas').addEventListener('mousedown', e => {
    if (e.button !== 0 || view !== 'map' || query) return;
    panActive = true;
    panMoved = false;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panScrollL = $('canvas').scrollLeft;
    panScrollT = $('canvas').scrollTop;
  });

  addEventListener('mousemove', e => {
    if (!panActive) return;
    const dx = e.clientX - panStartX;
    const dy = e.clientY - panStartY;
    if (!panMoved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
      panMoved = true;
      $('canvas').classList.add('is-dragging');
    }
    if (panMoved) {
      $('canvas').scrollLeft = panScrollL - dx;
      $('canvas').scrollTop = panScrollT - dy;
    }
  });

  addEventListener('mouseup', () => {
    if (!panActive) return;
    panActive = false;
    $('canvas').classList.remove('is-dragging');
    if (panMoved) setTimeout(() => { panMoved = false; }, 0);
  });

  $('canvas').addEventListener('click', e => {
    if (panMoved) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    const hubBtn = e.target.closest('[data-hub]');
    if (hubBtn) {
      hub = DATA.nodes[Number(hubBtn.dataset.hub)];
      showDetail(hub);
      render(false);
      return;
    }
    const nodeBtn = e.target.closest('[data-node]');
    if (nodeBtn) {
      const n = DATA.nodes[Number(nodeBtn.dataset.node)];
      showDetail(n);
      highlightSelectedNode(n.id);
    }
  });

  // Direct mouse wheel zoom toward cursor inside diagram (no Ctrl or toolbar needed)
  $('canvas').addEventListener('wheel', e => {
    if (view !== 'map' || query) return;
    e.preventDefault();
    const step = Math.abs(e.deltaY) < 40 ? 1.07 : 1.13;
    const factor = e.deltaY < 0 ? step : 1 / step;
    applyZoom(zoom * factor, e.clientX, e.clientY);
  }, { passive: false });

  // Double-click empty canvas to reset zoom to fit
  $('canvas').addEventListener('dblclick', e => {
    if (view !== 'map' || query || e.target.closest('button')) return;
    fitZoom();
    $('canvas').scrollTo({ top: 0, left: 0, behavior: 'smooth' });
  });

  $('branches').addEventListener('click', e => {
    const b = e.target.closest('[data-branch]');
    if (!b) return;
    branch = DATA.nodes[Number(b.dataset.branch)];
    hub = DATA.nodes[branch.ch[0]];
    query = '';
    $('search').value = '';
    $('canvas').scrollTop = 0;
    showDetail(hub);
    render(true);
  });

  $('groups').addEventListener('change', e => {
    hub = DATA.nodes[Number(e.target.value)];
    query = '';
    $('search').value = '';
    view = 'map';
    $('canvas').scrollTop = 0;
    showDetail(hub);
    render(false);
  });

  let searchTimer = 0;
  $('search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const val = e.target.value.trim();
    searchTimer = setTimeout(() => {
      query = val;
      $('canvas').scrollTop = 0;
      render(false);
    }, 130);
  });

  $('mapBtn').onclick = () => { view = 'map'; query = ''; $('search').value = ''; $('canvas').scrollTop = 0; render(true); };
  $('listBtn').onclick = () => { view = 'list'; $('canvas').scrollTop = 0; render(false); };

  function openData(payload) {
    DATA = payload.data;
    for (let i = 0; i < DATA.cards.length; i++) {
      const c = DATA.cards[i];
      c._norm = norm(c.t + ' ' + c.d);
    }
    branches = DATA.nodes.filter(n => n.k === 'limb' && n.ch.length);
    branchCardCounts = new Map();
    for (let i = 0; i < branches.length; i++) {
      branchCardCounts.set(branches[i].id, getBranchNodes(branches[i]).length);
    }
    const seen = new Set();
    allCardNodes = [];
    for (let i = 0; i < DATA.nodes.length; i++) {
      const n = DATA.nodes[i];
      if (n.ci >= 0 && !seen.has(DATA.cards[n.ci].id)) {
        seen.add(DATA.cards[n.ci].id);
        allCardNodes.push(n);
      }
    }

    branch = branches[0] || null;
    hub = branch ? DATA.nodes[branch.ch[0]] : null;
    selected = null;
    view = 'map';
    query = '';
    $('search').value = '';
    deckTitleText = payload.title || 'Bộ từ';
    $('deckTitle').textContent = deckTitleText;
    $('crumbDeck').textContent = deckTitleText;
    $('deckStats').textContent = DATA.cards.length.toLocaleString('vi-VN') + ' từ & cụm từ · ' + branches.length + ' nhánh';
    if (hub) showDetail(hub);
    render(true);
  }

  window.addEventListener('message', e => {
    if (e.origin !== location.origin || e.source !== parent || e.data?.type !== 'kf-tree-data') return;
    openData(e.data);
  });

  parent.postMessage({ type: 'kf-tree-ready' }, location.origin);
})();
</script>
</body>
</html>
