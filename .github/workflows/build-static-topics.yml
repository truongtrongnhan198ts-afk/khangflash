name: Build Static Topics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Build static topic JSON files
        run: node scripts/build-static-topics.mjs

      - name: Commit and push static-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-data
          if ! git diff --cached --quiet; then
            git commit -m "chore: build static topic JSON files"
            git push origin main
          else
            echo "No changes in static-data"
          fi
