name: tmp-find-piper
on: push
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -rn "Trực tuyến · Piper\|Piper · UK\|KVoiceUI" . --exclude-dir=.git | cut -c1-250 || true
      - run: python3 -c 'import os,re; pat=re.compile(r"Trực tuyến · Piper|Piper · UK|KVoiceUI"); [print(f"FILE={os.path.join(r,f)} LINE={t[:m.start()].count(chr(10))+1} COL={m.start()-t[:m.start()].rfind(chr(10))} MATCH={m.group(0)} CONTEXT={repr(t[max(0,m.start()-100):m.end()+100])}") for r,d,fs in os.walk(".") if ".git" not in r.split(os.sep) for f in sorted(fs) if os.path.isfile(os.path.join(r,f)) for t in [open(os.path.join(r,f),encoding="utf-8",errors="ignore").read()] for m in [pat.search(t)] if m]'
