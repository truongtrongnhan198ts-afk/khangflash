{"name": "tmp-read-voice-patch", "on": ["push"], "jobs": {"read": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "python3 -c \"import re; pat=re.compile(r'voice-dialog|voice-local|KVoice|Piper|Alba|Lessac|kokoro', re.I); lines=[f'{i}: {l.rstrip()[:400]}' for i,l in enumerate(open('live-override-custom.js', encoding='utf-8', errors='replace'), 1) if 125<=i<=3847 and pat.search(l)]; print('\\n'.join(lines[:60]))\""}]}}}
