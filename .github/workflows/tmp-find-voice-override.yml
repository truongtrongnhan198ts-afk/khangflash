name: tmp-find-voice-override
on:
  push:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan files
        run: |
          python3 - << 'EOF'
          import os, re
          terms = ['voice-dialog', 'voice-local', 'KVoice', 'atob(', 'DecompressionStream', 'inflate', 'fromCharCode']
          exts = ('.js', '.html', '.json')
          hits = []
          live_path = None
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'static-data')]
              for f in files:
                  if not f.endswith(exts):
                      continue
                  p = os.path.join(root, f)
                  if f == 'live-override-custom.js':
                      live_path = p
                  try:
                      txt = open(p, 'r', encoding='utf-8', errors='ignore').read()
                  except Exception:
                      continue
                  matched = [t for t in terms if t in txt]
                  if '\\u' in txt:
                      dec = re.sub(r'\\u([0-9a-fA-F]{4})', lambda m: chr(int(m.group(1), 16)), txt)
                      if any(k in dec.lower() for k in ('voice-dialog', 'voice-local', 'kvoice', 'voice')):
                          if any(k in dec.lower() and k not in txt.lower() for k in ('voice', 'kvoice', 'dialog')):
                              matched.append('unicode-voice')
                          elif re.search(r'\\u[0-9a-fA-F]{4}.*voice|voice.*\\u[0-9a-fA-F]{4}', txt, re.I):
                              matched.append('unicode-near-voice')
                  if matched:
                      hits.append((p, matched))
          print("=== MATCHING FILES ===")
          for p, m in sorted(hits):
              print(f"{p}: {', '.join(m)}")
          print("\n=== live-override-custom.js ===")
          if not live_path:
              print("live-override-custom.js NOT FOUND")
          else:
              txt = open(live_path, 'r', encoding='utf-8', errors='ignore').read()
              lines = txt.splitlines()
              print(f"Path: {live_path}, Lines: {len(lines)}, Chars: {len(txt)}")
              pat = re.compile(r'voice|KVoice|tts|speech|audio|dialog|atob|base64|decode', re.I)
              count = 0
              for idx, line in enumerate(lines, 1):
                  for m in pat.finditer(line):
                      s = max(0, m.start() - 200)
                      e = min(len(line), m.end() + 200)
                      print(f"[Line {idx}, col {m.start()}] ...{line[s:e]}...")
                      count += 1
                      if count >= 30:
                          break
                  if count >= 30:
                      break
              print(f"Total printed: {count}")
          EOF
